<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Твоя карта · чат-бот (демо)</title><meta name="description" content="Демонстрационный чат-бот: бесплатная карта дня и пример заказа личного расклада."><meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:dark;--ink:#f5ecdf;--muted:#bcaec8;--gold:#efd19e;--bg:#181422;--panel:#2c2539;--edge:#4d405b}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#100d17;color:var(--ink);font:15px/1.45 Arial,system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}#app{height:100dvh;max-width:520px;margin:auto;background:radial-gradient(ellipse at 90% 0%,#34263f 0%,transparent 42%),var(--bg);display:flex;flex-direction:column;overflow:hidden}header{flex:none;display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--edge);background:#251d30}.avatar{width:44px;height:44px;flex:none;display:grid;place-items:center;background:#43334d;border:1px solid #bd9b72;color:var(--gold);font-size:27px;border-radius:50%}.identity{flex:1;min-width:0}.identity strong{display:block;font-size:16px}.identity span{font-size:12px;color:var(--muted)}.badge{font-size:10px;color:var(--gold);border:1px solid #8d755f;border-radius:100px;padding:5px 8px;letter-spacing:.07em}#history{flex:1;min-height:0;overflow-y:auto;padding:16px 15px 25px;scroll-behavior:smooth}.time{text-align:center;font-size:11px;color:#b5a5c1;margin:0 0 16px}.bubble{white-space:pre-wrap;word-break:break-word;max-width:94%;background:var(--panel);border:1px solid #3e344c;padding:13px 15px;margin-bottom:12px;border-radius:3px 16px 16px 16px;box-shadow:0 2px 10px #0e0a171f}.bubble.user{margin-left:auto;max-width:85%;background:#4c3956;border-color:#604768;border-radius:16px 3px 16px 16px}.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}.bubble h2{font:normal 26px/1.15 Georgia,serif;margin:0 0 7px;color:var(--gold)}.small{font-size:12px;color:var(--muted)}.deck{display:flex;gap:10px;margin:9px 0 14px;justify-content:center}.deck svg{width:30%;max-width:120px;height:auto;display:block}.face{width:min(175px,70%);margin:6px auto 15px}.face svg{width:100%;display:block}.controls{display:flex;flex-direction:column;gap:8px;margin:5px 0 14px}.controls button{border:1px solid #62506e;padding:13px 11px;border-radius:12px;background:#392e46;text-align:center;font-size:14px;font-weight:600;line-height:1.25}.controls button:first-child{background:var(--gold);color:#392a3c;border-color:var(--gold)}.controls.horizontal{flex-direction:row}.controls.horizontal button{flex:1;background:#392e46;color:var(--gold);border-color:#a88a73}.controls button:hover{filter:brightness(1.1)}footer{flex:none;padding:10px 13px max(11px,env(safe-area-inset-bottom));border-top:1px solid var(--edge);background:#211a2c;display:flex;align-items:center;gap:8px}footer span{flex:1;min-width:0;color:var(--muted);font-size:12px}footer button{padding:9px 13px;background:#372c44;border:1px solid #6d5676;border-radius:10px;font-size:12px}.offer{display:flex;justify-content:space-between;gap:8px;align-items:start;padding:11px 0;border-bottom:1px solid var(--edge)}.offer:last-child{border-bottom:0}.offer strong{font-size:14px;line-height:1.3}.offer small{display:block;font-size:12px;color:var(--muted);margin-top:5px}.price{white-space:nowrap;color:var(--gold);font-size:13px;font-weight:bold}#history::-webkit-scrollbar{width:5px}#history::-webkit-scrollbar-thumb{background:#665373;border-radius:5px}
</style></head><body><div id="app"><header><div class="avatar">☾</div><div class="identity"><strong>Твоя карта</strong><span>демо чат-бота таролога</span></div><span class="badge">ДЕМО</span></header><main id="history" aria-live="polite"></main><footer><span>Тестовые данные · без оплат и реальных заявок</span><button id="home">Меню</button></footer></div><script src="catalogue.js"></script><script>
'use strict';
const {cards,offers,topics,disclaimer}=window.TAROT;
const historyEl=document.getElementById('history'), params=new URLSearchParams(location.search);
let storage={};try{storage=JSON.parse(localStorage.getItem('tarot_demo_v1')||'{}')||{}}catch{}
const persist=()=>{try{localStorage.setItem('tarot_demo_v1',JSON.stringify(storage))}catch{}};
const date=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function scroll(){requestAnimationFrame(()=>historyEl.scrollTo({top:historyEl.scrollHeight,behavior:'auto'}))}
function bubble(text,kind='bot',html=false){const e=document.createElement('div');e.className='bubble'+(kind==='user'?' user':'');if(html)e.innerHTML=text;else e.textContent=text;historyEl.append(e);scroll();return e}
function action(label,fn){return {label,fn}}
function clearActions(){document.querySelectorAll('.controls').forEach(e=>e.remove())}
function options(items,horizontal=false){clearActions();const box=document.createElement('div');box.className='controls'+(horizontal?' horizontal':'');for(const item of items){const b=document.createElement('button');b.textContent=item.label;b.addEventListener('click',()=>{clearActions();bubble(item.label,'user');item.fn()},{once:true});box.append(b)}historyEl.append(box);scroll()}
function reset(){historyEl.innerHTML='<div class="time">Сегодня · демонстрация</div>';home()}
function svg(card){const face=!!card;const symbol=face?card[5]:'';let art='';
 if(!face||symbol==='moon')art='<path d="M57 37A26 26 0 1 0 76 76A23 23 0 0 1 57 37Z" fill="#efd19e"/>';
 else if(symbol==='sun'||symbol==='wheel')art='<circle cx="50" cy="65" r="20" fill="'+(symbol==='sun'?'#efd19e':'none')+'" stroke="#efd19e" stroke-width="1.5"/>'+Array.from({length:12},(_,i)=>'<path d="M50 38v-9" stroke="#efd19e" transform="rotate('+(i*30)+' 50 65)"/>').join('');
 else if(symbol==='heart')art='<path d="M50 85C-5 48 30 30 50 52C70 30 105 48 50 85Z" fill="#cda8c9" stroke="#efd19e"/>';
 else if(symbol==='flower')art=Array.from({length:6},(_,i)=>'<ellipse cx="50" cy="51" rx="12" ry="18" transform="rotate('+(i*60)+' 50 65)" fill="#cda8c9" fill-opacity=".45" stroke="#efd19e"/>').join('')+'<circle cx="50" cy="65" r="8" fill="#efd19e"/>';
 else if(symbol==='tower')art='<path d="M36 90V45H64V90M31 45V34H42V39H58V34H69V45M43 90V74H57V90Z" stroke="#efd19e" fill="none"/>';
 else if(symbol==='scales')art='<path d="M50 37V95M20 51H80M20 51L10 75H30ZM80 51L70 75H90ZM35 95H65" stroke="#efd19e" fill="none" stroke-width="2"/>';
 else if(symbol==='wand')art='<path d="M35 92L64 38" stroke="#efd19e" stroke-width="5" stroke-linecap="round"/><path d="M64 22v28M50 36h28" stroke="#efd19e"/>';
 else if(symbol==='crown')art='<path d="M15 48L32 65 50 37 68 65 85 48 76 87H24Z" fill="#efd19e"/>';
 else art='<path d="M50 29L58 52H82L63 66 70 90 50 76 30 90 37 66 18 52H42Z" fill="#efd19e"/>';
 return '<svg viewBox="0 0 100 150" role="img" aria-label="'+(face?card[1]:'Закрытая карта')+'"><rect x="1" y="1" width="98" height="148" rx="9" fill="#3a2e4a" stroke="#d4b37f" stroke-width="1.5"/><rect x="6" y="6" width="88" height="138" rx="5" fill="none" stroke="#a88c71" stroke-width=".7"/><path d="M50 16L89 73 50 130 11 73Z" fill="none" stroke="#a88c71" stroke-width=".7"/>'+art+'<path d="M17 24h8m-4-4v8M75 24h8m-4-4v8M17 122h8m-4-4v8M75 122h8m-4-4v8" stroke="#cbb3d5"/>'+(face?'<text x="50" y="17" text-anchor="middle" font-size="7" fill="#efd19e">'+card[0]+'</text>':'')+'</svg>'}
const menuAction=()=>action('Главное меню',home);
function home(){bubble('🌙 Привет! Здесь можно получить бесплатную карту дня или посмотреть, как заказать личный расклад.\n\nТексты, изображения и цены в этом примере предварительные.');options([action('✨ Получить карту дня',dayFlow),action('Личные расклады и цены',offerList),action('🔔 Напоминания',reminders),action('О демо',about)])}
function dayFlow(){if(storage.day===date()&&Number.isInteger(storage.card)&&cards[storage.card])return result();bubble('Посмотри на три закрытые карты. Выбери одну — сегодня она будет твоей картой дня.');bubble('<div class="deck">'+svg()+svg()+svg()+'</div>','bot',true);options([0,1,2].map(i=>action('Карта '+(i+1),()=>{if(storage.day!==date()||!cards[storage.card]){storage.day=date();storage.card=Math.floor(Math.random()*cards.length);persist()}result()})),true)}
function result(){const c=cards[storage.card];bubble('<div class="face">'+svg(c)+'</div><h2>'+c[1]+'</h2><p style="color:var(--gold)">'+c[2]+'</p><p>'+c[3]+'</p><p><strong>Вопрос к себе</strong><br>'+c[4]+'</p><p class="small">'+disclaimer+'</p>','bot',true);options([action('Напомнить о новой карте завтра',reminders),action('Посмотреть личные расклады',offerList),menuAction()])}
function reminders(){bubble(storage.reminder?'В примере напоминания включены. В настоящем Telegram-боте это будет одно сообщение в день в 09:00 по Москве.':'Хочешь получать карту дня с напоминанием в 09:00 по Москве? Здесь можно посмотреть, как работает настройка. Веб-демо не отправляет уведомления.');options([action(storage.reminder?'Отключить напоминания':'Включить напоминания',()=>{storage.reminder=!storage.reminder;persist();bubble(storage.reminder?'✓ Настройка включена в демо. Реального сообщения не будет.':'✓ Настройка выключена.');options([menuAction(),action('Моя карта дня',dayFlow)])}),menuAction()])}
function offerList(){bubble('Выбери формат. Личные расклады делает сама девушка. Автоматический вариант — отдельная идея для обсуждения.');bubble(Object.values(offers).map(o=>'<div class="offer"><div><strong>'+o[0]+'</strong><small>'+o[2]+'</small></div><div class="price">'+o[1]+'</div></div>').join('')+'<p class="small">Это условные цены для демонстрации.</p>','bot',true);options(Object.entries(offers).map(([k,o])=>action(o[0]+' · '+o[1],()=>offer(k))).concat(menuAction()))}
function offer(k){bubble(offers[k][0]+'\n'+offers[k][1]+' — пример цены.\n\n'+offers[k][2]+'\n\nВыбери тему. Настоящие личные вопросы здесь не запрашиваем.');options(Object.entries(topics).map(([t,name])=>action(name,()=>preview(k,t))).concat(action('Другой формат',offerList),menuAction()))}
function preview(k,t){bubble('Проверь тестовый заказ\n\n'+offers[k][0]+'\nТема — '+topics[t]+'\nСтоимость — '+offers[k][1]+' (условно)\n\nПример вопроса: на что я могу обратить внимание в этой ситуации?\n\nНикаких платежей и реальной передачи заявки. '+disclaimer);options([action('Подтвердить демо-заказ',()=>done(k)),action('Изменить тему',()=>offer(k)),menuAction()])}
function done(k){if(k==='auto'){const used=new Set();while(used.size<3)used.add(Math.floor(Math.random()*cards.length));const lines=[...used].map((i,n)=>['Что заметить','На что опираться','О чём подумать'][n]+' — '+cards[i][1]+'\n'+cards[i][3]);bubble('✨ Пример автоматического расклада\n\n'+lines.join('\n\n')+'\n\nЭто не личная работа таролога. Оплаты не было.')}else bubble('✓ Тестовый заказ оформлен\n\nВ рабочей версии таролог получила бы информацию о заказе и согласовала срок. Сейчас никому ничего не отправлено, деньги не списаны.');options([menuAction(),action('Получить карту дня',dayFlow)])}
function about(){bubble('Это чатовый пример, а не действующий Telegram-бот. В нём 22 старших аркана с условными авторскими иллюстрациями. '+disclaimer+'\n\nВ этой вкладке сохраняется только карта дня и тестовая настройка напоминаний. Реальные данные и сообщения никуда не уходят.');options([action('Очистить данные демо',()=>{storage={};try{localStorage.removeItem('tarot_demo_v1')}catch{};reset()}),menuAction()])}
document.getElementById('home').onclick=()=>{clearActions();bubble('Главное меню','user');home()};
historyEl.innerHTML='<div class="time">Сегодня · демонстрация</div>';
if(params.get('start')==='card')dayFlow();else if(params.get('start')==='order')offerList();else home();
</script></body></html>
